name: Deploy Teacher to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-teacher-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GEMINI_API_KEY
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.local/bin
            cd /var/www/teacher

            # 1. Mise à jour du code
            git fetch origin main
            git reset --hard origin/main

            # 2. Variables d'environnement
            printf "%s\n" \
              "GEMINI_API_KEY=$GEMINI_API_KEY" \
              "PORT=8005" \
              "HOST=0.0.0.0" \
              "ENV=production" > .env
            chmod 600 .env

            # 3. Dépendances Python
            .venv/bin/pip install -r requirements.txt

            # 4. Build Frontend
            cd frontend
            npm install
            npm run build
            cd ..

            # 5. Redémarrage propre PM2
            pm2 restart teacher --update-env

            # 6. Déploiement de la configuration Nginx & reload
            sudo cp nginx_teacher.conf /etc/nginx/sites-available/teacher
            sudo ln -sf /etc/nginx/sites-available/teacher /etc/nginx/sites-enabled/teacher
            sudo nginx -t && sudo systemctl reload nginx

