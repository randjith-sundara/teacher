server {
    server_name teacher.rsundara.ca;

    # Protection HTTP Basic Auth
    auth_basic "Accès Restreint — Teacher";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSockets & SSE (Streaming Tuteur IA)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/teacher.rsundara.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/teacher.rsundara.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = teacher.rsundara.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name teacher.rsundara.ca;
    return 404; # managed by Certbot
}
